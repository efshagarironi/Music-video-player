           // controls fade in (~300 ms) / out (~400 ms) like the reference video; they auto-close 3.5 s after the
           // last touch, but only while the video is playing (a paused video keeps them on screen)
           private var overlayShown = true
           private var hideArmed = false
           private val hideRun = Runnable {
            hideArmed = false
            if (vv.isPlaying) setOverlay(false)
           }

           private fun setOverlay(show: Boolean) {
            overlayShown = show
            overlay.animate().cancel()
            overlay.animate().setUpdateListener(null)
            if (show) {
             overlay.visibility = View.VISIBLE
             overlay.animate().alpha(1f).setDuration(300)
              .setInterpolator(android.view.animation.DecelerateInterpolator(1.4f))
              .start()
            } else {
             overlay.animate().alpha(0f).setDuration(400)
              .setInterpolator(android.view.animation.AccelerateDecelerateInterpolator())
              .withEndAction { if (!overlayShown) overlay.visibility = View.GONE }
              .start()
            }
           }

           // sideways swipe while the bars are visible: the bars fade out first, the gesture seek bar fades in
           // right behind them (cross-fade, no pause and no moment where both are on screen)
           private fun fadeOverlayForSeek() {
            if (overlay.visibility == View.VISIBLE && overlay.alpha > 0.02f) {
             overlayShown = false
             gSeek.animate().cancel()
             gSeek.alpha = 0f
             overlay.animate().cancel()
             overlay.animate().alpha(0f).setDuration(50)
              .setInterpolator(android.view.animation.LinearInterpolator())
              .setUpdateListener { gSeek.alpha = ((0.75f - overlay.alpha) / 0.75f).coerceIn(0f, 1f) }
              .withEndAction {
               overlay.animate().setUpdateListener(null)
               if (!overlayShown) overlay.visibility = View.GONE
               gSeek.alpha = 1f
              }
              .start()
            } else {
             setOverlay(false)
             gSeek.animate().cancel()
             gSeek.alpha = 1f
            }
           }

