           private fun folderMenu(name: String) {
            val items = if (VaultStore.noLock(this, name)) arrayOf("گذاشتن قفل", "تغییر نام", "حذف پوشه") else arrayOf("تغییر رمز / الگو", "تغییر نام", "حذف پوشه", "برداشتن قفل")
            AlertDialog.Builder(this)
             .setItems(items) { _, w ->
              startUnlock(name, if (w == 0) 1 else if (w == 1) 2 else if (w == 3) 6 else 3)
             }
             .show()
           }

           // ------------------------------------------------------------------ lock helpers
           private fun startUnlock(name: String, action: Int) {
            pName = name
            pAction = action
            // lock removed: no PIN / pattern is asked
            if (VaultStore.noLock(this, name)) {
             unlocked(name, action, true)
             return
            }
            external = true
            val i = Intent(this, LockActivity::class.java)
            i.putExtra("mode", "unlock")
            i.putExtra("vname", name)
            startActivityForResult(i, 81)
           }

           private fun chooseType(name: String) {
            AlertDialog.Builder(this)
             .setTitle("نوع قفل")
             .setItems(arrayOf("🔢  رمز عددی", "🔷  الگو")) { _, w ->
              pName = name
              external = true
              val i = Intent(this, LockActivity::class.java)
              i.putExtra("mode", "set")
              i.putExtra("type", if (w == 0) "pin" else "pattern")
              i.putExtra("vname", name)
              startActivityForResult(i, 82)
             }
             .show()
           }

           private fun askNewFolder() {
            val et = EditText(this)
            et.setSingleLine(true)
            et.hint = "نام پوشهٔ خصوصی"
            val box = FrameLayout(this)
            box.setPadding(dp(20), dp(8), dp(20), 0)
            box.addView(et, FrameLayout.LayoutParams(MP, WC))
            AlertDialog.Builder(this)
             .setTitle("پوشهٔ خصوصی جدید")
             .setView(box)
             .setPositiveButton("ادامه") { _, _ ->
              val n = VaultStore.safeName(et.text.toString())
              if (n.isEmpty()) {
               toast("نام را وارد کن")
              } else if (VaultStore.exists(this, n)) {
               toast("این نام قبلاً وجود دارد")
              } else {
               chooseType(n)
              }
             }
             .setNegativeButton("لغو") { _, _ ->
              pendingMove = null
              pendingFrom = null
             }
             .show()
           }

           private fun askRename(name: String) {
            val et = EditText(this)
            et.setSingleLine(true)
            et.setText(name)
            et.setSelection(et.text.length)
            val box = FrameLayout(this)
            box.setPadding(dp(20), dp(8), dp(20), 0)
            box.addView(et, FrameLayout.LayoutParams(MP, WC))
            AlertDialog.Builder(this)
             .setTitle("تغییر نام")
             .setView(box)
             .setPositiveButton("تأیید") { _, _ ->
              val n = VaultStore.safeName(et.text.toString())
              if (n.isEmpty() || n == name) {
               // nothing to do
              } else if (VaultStore.exists(this, n)) {
               toast("این نام قبلاً وجود دارد")
              } else if (VaultStore.rename(this, name, n)) {
               showList()
              } else {
               toast("تغییر نام ممکن نشد")
              }
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           private fun confirmDeleteFolder(name: String) {
            AlertDialog.Builder(this)
             .setTitle("حذف پوشهٔ خصوصی؟")
             .setMessage("پوشهٔ «" + name + "» و همهٔ ویدئوهای داخل آن برای همیشه پاک می‌شوند.")
             .setPositiveButton("حذف") { _, _ ->
              try {
               VaultStore.dir(this, name).deleteRecursively()
              } catch (e: Throwable) {
              }
              VaultStore.forget(this, name)
              showList()
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
            super.onActivityResult(requestCode, resultCode, data)
            if (requestCode == 77) {
             askingPage = false
             if (resultCode == RESULT_OK) pageOk = true else finish()
             return
            }
            val n = pName
            if (requestCode == 81) {
             if (resultCode == RESULT_OK && n != null) {
              unlocked(n, pAction, false)
             } else if (pAction == 5) {
              pQueue.clear()
              toast("حذف متوقف شد")
             }
            } else if (requestCode == 82) {
             if (resultCode == RESULT_OK && n != null) {
              toast("قفل پوشه ذخیره شد")
              val pm = pendingMove
              val from = pendingFrom
              pendingMove = null
              pendingFrom = null
              if (pm != null && from != null) moveToVault(from, n, pm)
              offerFp(n)
             } else {
              pendingMove = null
              pendingFrom = null
             }
            }
           }

           // the folder's lock was accepted (or the folder has no lock): do what was asked
           private fun unlocked(n: String, action: Int, direct: Boolean) {
            when (action) {
             0 -> {
              cur = n
              if (direct) render()
             }
             1 -> chooseType(n)
             2 -> askRename(n)
             4 -> toggleFp(n)
             5 -> {
              // group delete: this folder's own PIN / pattern / fingerprint was accepted
              try {
               VaultStore.dir(this, n).deleteRecursively()
              } catch (e: Throwable) {
              }
              VaultStore.forget(this, n)
              pQueue.remove(n)
              nextDelete()
             }
             6 -> {
              VaultStore.removeLock(this, n)
              toast("قفل پوشه برداشته شد؛ حالا بدون قفل باز می‌شود")
              showList()
             }
             else -> confirmDeleteFolder(n)
            }
           }

