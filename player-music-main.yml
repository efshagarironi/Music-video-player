             return
            }

            val lv = ListView(this)
            lv.divider = null
            lv.dividerHeight = 0
            lv.selector = ColorDrawable(Color.TRANSPARENT)
            lv.cacheColorHint = Color.TRANSPARENT
            lv.setPadding(dp(8), dp(0), dp(8), dp(24))
            lv.clipToPadding = false
            lv.adapter = object : BaseAdapter() {
             override fun getCount(): Int = pl.items.size
             override fun getItem(position: Int): Any = pl.items[position]
             override fun getItemId(position: Int): Long = position.toLong()
             override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View = itemRow(pl, position)
            }
            lv.setOnItemClickListener { _, _, p, _ -> play(pl, p, false) }
            content.addView(lv, LinearLayout.LayoutParams(MP, 0, 1f))
           }

           private fun itemRow(pl: PL, i: Int): View {
            val item = pl.items[i]
            val row = LinearLayout(this)
            row.orientation = LinearLayout.HORIZONTAL
            row.gravity = Gravity.CENTER_VERTICAL
            row.setPadding(dp(8), dp(8), dp(4), dp(8))

            val box = thumbBox(106, 60)
            box.addView(playGlyph(), 0, FrameLayout.LayoutParams(MP, MP))
            bindThumb(box.tag as ImageView, item.uri)
            if (item.dur > 0L) {
             val b = label(Ui.dur(item.dur), 10f, Color.WHITE)
             b.background = Ui.rect(this, Color.argb(170, 0, 0, 0), 6)
             b.setPadding(dp(5), dp(1), dp(5), dp(1))
             val bpar = FrameLayout.LayoutParams(WC, WC, Gravity.BOTTOM or Gravity.END)
             bpar.setMargins(dp(4), dp(4), dp(4), dp(4))
             box.addView(b, bpar)
            }
            row.addView(box)

            val col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            col.setPaddingRelative(dp(14), 0, dp(8), 0)
            val n = label((i + 1).toString() + ". " + item.title, 15f, Ui.TEXT, true)
            n.maxLines = 2
            n.ellipsize = TextUtils.TruncateAt.END
            col.addView(n)
            row.addView(col, LinearLayout.LayoutParams(0, WC, 1f))

            val menu = label("⋮", 24f, Ui.TEXT)
            menu.setPadding(dp(14), dp(8), dp(14), dp(8))
            menu.setOnClickListener { itemMenu(pl, i) }
