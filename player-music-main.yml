           // ---------------- lock video (in-app lock, no screen pinning) ----------------
           private fun applyLockUi() {
            lockBtn.locked = locked
            lockBtn.alpha = if (locked) 1f else 0.6f
            folderBtn.visibility = if (locked) View.INVISIBLE else View.VISIBLE
            bottomBarView?.visibility = if (locked) View.GONE else View.VISIBLE
            trashView?.visibility = if (locked) View.INVISIBLE else View.VISIBLE
            titleView.visibility = if (locked) View.INVISIBLE else View.VISIBLE
           }

           private fun toggleLock() {
            locked = !locked
            applyLockUi()
            showHud(if (locked) "🔒 ویدئو قفل شد" else "🔓 قفل باز شد")
            showOverlay()
           }

           override fun dispatchKeyEvent(event: android.view.KeyEvent): Boolean {
            if (locked) {
             val k = event.keyCode
             if (k == android.view.KeyEvent.KEYCODE_BACK || k == android.view.KeyEvent.KEYCODE_MEDIA_NEXT ||
              k == android.view.KeyEvent.KEYCODE_MEDIA_PREVIOUS || k == android.view.KeyEvent.KEYCODE_MEDIA_FAST_FORWARD ||
              k == android.view.KeyEvent.KEYCODE_MEDIA_REWIND || k == android.view.KeyEvent.KEYCODE_MEDIA_STOP ||
              k == android.view.KeyEvent.KEYCODE_DPAD_LEFT || k == android.view.KeyEvent.KEYCODE_DPAD_RIGHT
             ) {
              if (k == android.view.KeyEvent.KEYCODE_BACK && event.action == android.view.KeyEvent.ACTION_UP) {
               showHud("🔒 برای خروج، اول قفل را باز کن")
               showOverlay()
              }
              return true
             }
            }
            return super.dispatchKeyEvent(event)
           }

           // ---------------- remember last watch position ----------------
           private fun updateResumeIcon() {
            resumeBtn.resumeOn = resumeEnabled
            resumeBtn.alpha = if (resumeEnabled) 1f else 0.45f
           }

           private fun toggleResume() {
            resumeEnabled = !resumeEnabled
            getSharedPreferences("prefs", MODE_PRIVATE).edit().putBoolean("resume_on", resumeEnabled).apply()
            updateResumeIcon()
            showHud(if (resumeEnabled) "ذخیره آخرین نقطه تماشا: روشن" else "ذخیره آخرین نقطه تماشا: خاموش")
            showOverlay()
           }

           // Saves the exact playing time of the current video (called when leaving the video / the player)
           // remembers how much of each video was watched (used by the folder browser: status / watched time)
           private fun recordPlayed() {
            if (privateMode || !prepared || index !in uris.indices) return
            var p = vv.currentPosition
            if (p == 0 && pos > 0) p = pos
            if (p < 3000) return
            val sp = getSharedPreferences("played", MODE_PRIVATE)
            if (sp.getInt(uris[index], 0) == -1) return
            val d = vv.duration
            val e = sp.edit()
            if (d > 0 && p >= d - 3000) e.putInt(uris[index], -1) else e.putInt(uris[index], p)
            e.apply()
           }

           // remembers the last video and where it stopped (used by the floating button of the folders page)
           private fun saveLast() {
            if (privateMode || !prepared || index !in uris.indices) return
            var p = vv.currentPosition
            if (p == 0 && pos > 0) p = pos
            val d = vv.duration
            val v = if (completed || (d > 0 && p >= d - 3000)) -1 else p
            getSharedPreferences("last", MODE_PRIVATE).edit()
             .putString("uri", uris[index])
             .putString("title", titles.getOrElse(index) { "" })
             .putInt("pos", v)
             .apply()
           }

           private fun saveResume() {
            saveLast()
            recordPlayed()
            if (privateMode || !resumeEnabled || !prepared || index !in uris.indices) return
            var p = vv.currentPosition
            if (p == 0 && pos > 0) p = pos
            val d = vv.duration
            val e = getSharedPreferences("resume", MODE_PRIVATE).edit()
            if (p < 3000 || (d > 0 && p >= d - 3000)) e.remove(uris[index]) else e.putInt(uris[index], p)
            e.apply()
           }

           private fun savedResume(): Int {
            if (!resumeEnabled || index !in uris.indices) return 0
            return getSharedPreferences("resume", MODE_PRIVATE).getInt(uris[index], 0)
           }

           private fun cycleRepeat() {
            repeatMode = (repeatMode + 1) % 4
            getSharedPreferences("prefs", MODE_PRIVATE).edit().putInt("repeat", repeatMode).apply()
            try {
             mpRef?.isLooping = (repeatMode == 1)
            } catch (e: Exception) {
            }
            updateRepeatIcon()
            showOverlay()
           }

           private fun applyAspect() {
            vv.fitMode = aspectMode
            aspectBtn.aspect = aspectMode
           }

           private fun cycleAspect() {
            aspectMode = (aspectMode + 1) % 4
            userZoom = 1f
            vv.scaleX = 1f
            vv.scaleY = 1f
            getSharedPreferences("prefs", MODE_PRIVATE).edit().putInt("aspect", aspectMode).apply()
            applyAspect()
            showHud(when (aspectMode) {
             0 -> "متناسب"
             1 -> "کشیده"
             2 -> "پر کردن صفحه"
             else -> "اندازه اصلی"
            })
            showOverlay()
           }

           private fun updateNav() {
            prevBtn.alpha = if (index > 0) 1f else 0.35f
            nextBtn.alpha = if (index < uris.size - 1) 1f else 0.35f
           }

           private fun loadAt(i: Int) {
            if (i < 0 || i >= uris.size) return
            saveResume()
            prepared = false
            completed = false
            holdPaused = false
            index = i
            pos = 0
            titleView.text = titles.getOrElse(i) { "" }
            seek.progress = 0
            cur.text = "0:00"
            total.text = "0:00"
            vv.stopPlayback()
            vv.setVideoURI(Uri.parse(uris[i]))
            updateNav()
            if (!quietLoad) showOverlay()
            }

           private fun goNext(quiet: Boolean = false) {
           if (index < uris.size - 1) {
           if (!quiet) showHud("⏭")
           quietLoad = quiet
           loadAt(index + 1)
           } else {
             showHud("آخرین ویدئو")
            }
           }

           private fun goPrev(quiet: Boolean = false) {
           if (index > 0) {
           if (!quiet) showHud("⏮")
           quietLoad = quiet
           loadAt(index - 1)
           } else {
             showHud("اولین ویدئو")
            }
           }

           // ---------------- touch gestures ----------------
           // hold + drag sideways: live seek | pinch: zoom | double tap edges: next/previous
           // drag up/down: volume (bar on the touched side) | double tap: pause / resume
           // MX-style scrubbing: video is paused (so no sound), seeks are keyframe-only and never queue up.
           private fun issueScrub() {
            val t = scrubPending
            val m = mpRef
            if (t < 0 || m == null) return
            scrubPending = -1
            scrubBusy = true
            scrubBusyAt = SystemClock.uptimeMillis()
            try {
             m.seekTo(t)
            } catch (ex: Exception) {
             scrubBusy = false
            }
           }

           private fun scrubTo(t: Int) {
            scrubPending = t
            if (scrubBusy && SystemClock.uptimeMillis() - scrubBusyAt > 500) scrubBusy = false
            if (!scrubBusy) issueScrub()
           }

           private fun finishScrub(target: Int) {
            scrubPending = -1
            scrubBusy = false
            val m = mpRef
            if (m != null) {
             try {
              if (Build.VERSION.SDK_INT >= 26) m.seekTo(target.toLong(), MediaPlayer.SEEK_CLOSEST)
              else m.seekTo(target)
             } catch (ex: Exception) {
              vv.seekTo(target)
             }
            } else {
             vv.seekTo(target)
            }
            if (seekWasPlaying) vv.start()
            seekWasPlaying = false
           }

           // The volume gesture only works above the bottom controls.
           private fun zoneTop(h: Int): Int = h - Math.max(bottomBarView?.height ?: 0, dp(130))

           // 1 = right edge, -1 = left edge, 0 = the rest of the screen
           private fun tapZone(x: Float, w: Int): Int = when {
            x > w * 0.7f -> 1
            x < w * 0.3f -> -1
            else -> 0
           }

           private fun showEdgeArrow(right: Boolean) {
            val lp = edgeArrow.layoutParams as FrameLayout.LayoutParams
            lp.gravity = (if (right) Gravity.RIGHT else Gravity.LEFT) or Gravity.CENTER_VERTICAL
            edgeArrow.layoutParams = lp
            edgeArrow.text = if (right) "❯" else "❮"
            edgeArrow.visibility = View.VISIBLE
            ui.removeCallbacks(hideArrow)
            ui.postDelayed(hideArrow, 450)
           }

           // Double tap on the centre: only a brief icon in the middle, the controls never appear.
           private fun togglePlay() {
           holdPaused = false
           if (vv.isPlaying) {
           vv.pause()
           setPlayIcon(false)
           showCenter("pause")
           } else {
           vv.start()
           setPlayIcon(true)
           showCenter("play")
           }
           }

           private fun showGSeek(frac: Float, w: Int) {
            ui.removeCallbacks(hideGSeek)
            gSeek.visibility = View.VISIBLE
            val barW = ((w - dp(32)) * BarPrefs.get(this, BarPrefs.progressSpecs[4]) / 100f).toInt()
            val gl = gSeek.layoutParams
            if (gl.width != barW) {
             gl.width = barW
             gSeek.layoutParams = gl
            }
            val lp = gSeekFill.layoutParams
            lp.width = (barW * frac.coerceIn(0f, 1f)).toInt()
            gSeekFill.layoutParams = lp
           }

           private fun currentBrightness(): Float {
            val b = window.attributes.screenBrightness
            if (b >= 0f) return b
            return try {
             android.provider.Settings.System.getInt(contentResolver, android.provider.Settings.System.SCREEN_BRIGHTNESS) / 255f
            } catch (e: Throwable) {
             0.5f
            }
           }

           // status bar (clock, notification icons) over the video, without resizing it
           private fun applyImmersive() {
            var f = (View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
              or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
            if (!statusShown) f = f or View.SYSTEM_UI_FLAG_FULLSCREEN else window.statusBarColor = Color.TRANSPARENT
            window.decorView.systemUiVisibility = f
           }

           private fun showVol(frac: Float, left: Boolean, color: Int = Ui.GREEN) {
            volFill.background = Ui.rect(this, color, 4)
            val lp = volBar.layoutParams as FrameLayout.LayoutParams
            lp.gravity = (if (left) Gravity.LEFT else Gravity.RIGHT) or Gravity.CENTER_VERTICAL
            volBar.layoutParams = lp
            volBar.visibility = View.VISIBLE
            val f = volFill.layoutParams
            f.height = (dp(160) * frac.coerceIn(0f, 1f)).toInt()
            volFill.layoutParams = f
            ui.removeCallbacks(hideVol)
            ui.postDelayed(hideVol, 800)
           }

           private fun onGesture(e: MotionEvent, w: Int, h: Int): Boolean {
            if (locked) {
             // video is locked: no seeking, no skipping, no zoom/volume gestures; a tap only shows the lock icon
             if (e.action == MotionEvent.ACTION_UP) showOverlay()
             return true
            }
            scaleDet.onTouchEvent(e)
            if (e.pointerCount > 1 && mode != 4) {
             // two fingers: pinch zoom only, cancel any seek / volume / tap in progress
             if (mode == 1) {
              finishScrub(startPos)
              gSeek.visibility = View.GONE
             }
             ui.removeCallbacks(tapRun)
             lastTapAt = 0L
             mode = 4
            }
            if (mode == 4) {
             if (e.actionMasked == MotionEvent.ACTION_UP || e.actionMasked == MotionEvent.ACTION_CANCEL) {
              tracker?.recycle()
              tracker = null
              mode = 0
             }
             return true
            }
            when (e.actionMasked) {
             MotionEvent.ACTION_DOWN -> {
              downX = e.x
              downY = e.y
              mode = 0
              startPos = vv.currentPosition
              startVol = audio.getStreamVolume(AudioManager.STREAM_MUSIC)
              startBri = currentBrightness()
              tracker?.recycle()
              tracker = VelocityTracker.obtain()
              tracker?.addMovement(e)
              return true
             }
             MotionEvent.ACTION_MOVE -> {
              tracker?.addMovement(e)
              val dx = e.x - downX
              val dy = e.y - downY
              if (mode == 0 && (Math.abs(dx) > slop || Math.abs(dy) > slop)) {
               // vertical drag: left third = volume, right third = brightness (this app only), centre = show / hide the status bar
               mode = if (Math.abs(dx) >= Math.abs(dy)) 1 else if (downY >= zoneTop(h)) 3 else if (downX < w * 0.35f) 2 else if (downX > w * 0.65f) 5 else 6
               ui.removeCallbacks(hideRun)
               ui.removeCallbacks(tapRun)
               lastTapAt = 0L
               if (mode == 1) {
                fadeOverlayForSeek()
                hud.visibility = View.GONE
                seekWasPlaying = vv.isPlaying
                if (seekWasPlaying) vv.pause()
               } else {
                volLeft = downX < w / 2f
               }
              }
              if (mode == 1) {
               val d = vv.duration
               val delta = (dx / Math.max(w, 1) * 120000f).toInt()
               seekTarget = (startPos + delta).coerceIn(0, if (d > 0) d else Int.MAX_VALUE)
               if (d > 0) showGSeek(seekTarget.toFloat() / d, w)
               if (d > 0) scrubTo(seekTarget)
              } else if (mode == 2) {
               val max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
               val v = Math.round(startVol + (-(Math.min(e.y, zoneTop(h).toFloat()) - downY) / Math.max(zoneTop(h), 1)) * max * 4f).coerceIn(0, max)
               audio.setStreamVolume(AudioManager.STREAM_MUSIC, v, 0)
               showVol(v.toFloat() / Math.max(max, 1), volLeft)
              } else if (mode == 5) {
               val b = (startBri - (e.y - downY) / Math.max(zoneTop(h), 1) * 4f).coerceIn(0.02f, 1f)
               val wl = window.attributes
               wl.screenBrightness = b
               window.attributes = wl
               showVol(b, false, Color.parseColor("#FBBF24"))
              } else if (mode == 6) {
               if (dy > dp(48) && !statusShown) {
                statusShown = true
                applyImmersive()
               } else if (dy < -dp(48) && statusShown) {
                statusShown = false
                applyImmersive()
               }
              }
              return true
             }
             MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
              val up = e.actionMasked == MotionEvent.ACTION_UP
              tracker?.addMovement(e)
              tracker?.computeCurrentVelocity(1000)
              val vx = tracker?.xVelocity ?: 0f
              val dx = e.x - downX
              if (up) {
               if (mode == 0) {
                val now = SystemClock.uptimeMillis()
                val dt = ViewConfiguration.getDoubleTapTimeout()
                val zone = tapZone(e.x, w)
                if (lastTapAt != 0L && now - lastTapAt <= dt && zone == lastTapZone) {
                 lastTapAt = 0L
                 ui.removeCallbacks(tapRun)
                 when (zone) {
                  1 -> {
                  showEdgeArrow(true)
                  goNext(true)
                  }
                  -1 -> {
                  showEdgeArrow(false)
                  goPrev(true)
                  }
                  else -> togglePlay()
                 }
                } else {
                 lastTapAt = now
                 lastTapZone = zone
                 ui.postDelayed(tapRun, dt.toLong())
                }
               } else if (mode == 1) {
                // fast flick no longer switches videos: always a normal seek
                finishScrub(seekTarget)
                seek.progress = seekTarget
                cur.text = Ui.dur(seekTarget.toLong())
                hideGSeekNow()
                if (!vv.isPlaying) setOverlay(true)
               }
              } else if (mode == 1) {
               finishScrub(seekTarget)
               hideGSeekNow()
              }
              tracker?.recycle()
              tracker = null
              mode = 0
              return true
             }
            }
            return true
           }

           // Title for a file opened from another app (ACTION_VIEW without a title extra)
           private fun externalTitle(u: Uri?): String {
            if (u == null) return ""
            try {
             contentResolver.query(u, arrayOf(android.provider.OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
              if (c.moveToFirst()) {
               val n = c.getString(0)
               if (!n.isNullOrEmpty()) return n
              }
             }
            } catch (e: Throwable) {
            }
            return u.lastPathSegment ?: ""
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
            volumeControlStream = AudioManager.STREAM_MUSIC
            audio = getSystemService(AUDIO_SERVICE) as AudioManager
            slop = ViewConfiguration.get(this).scaledTouchSlop
            repeatMode = getSharedPreferences("prefs", MODE_PRIVATE).getInt("repeat", 3).coerceIn(0, 3)
            aspectMode = getSharedPreferences("prefs", MODE_PRIVATE).getInt("aspect", 0).coerceIn(0, 3)
            resumeEnabled = getSharedPreferences("prefs", MODE_PRIVATE).getBoolean("resume_on", false)
            privateMode = intent.getBooleanExtra("private", false)
            if (privateMode) window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)

            val listU = intent.getStringArrayExtra("uris")
            val listT = intent.getStringArrayExtra("titles")
            if (listU != null && listU.isNotEmpty()) {
             uris = listU.toList()
             titles = listT?.toList() ?: emptyList()
             index = intent.getIntExtra("index", 0).coerceIn(0, uris.size - 1)
            } else {
             uris = listOf(intent.getStringExtra("uri") ?: intent.data?.toString() ?: "")
             titles = listOf(intent.getStringExtra("title") ?: externalTitle(intent.data))
             index = 0
            }
            if (savedInstanceState != null) {
             pos = savedInstanceState.getInt("pos", 0)
             locked = savedInstanceState.getBoolean("locked", false)
             holdPaused = savedInstanceState.getBoolean("held", false)
             index = savedInstanceState.getInt("index", index).coerceIn(0, uris.size - 1)
            } else {
             // started from the folders page floating button: continue from the saved time
             pos = intent.getIntExtra("startPos", 0).coerceAtLeast(0)
             if (intent.getBooleanExtra("autoNext", false) && repeatMode == 3) repeatMode = 2
            }

            val root = FrameLayout(this)
            root.setBackgroundColor(Color.BLACK)
            root.layoutDirection = View.LAYOUT_DIRECTION_LTR

            vv = ZoomVideoView(this)
            root.addView(
             vv,
             FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.MATCH_PARENT,
              FrameLayout.LayoutParams.MATCH_PARENT,
              Gravity.CENTER
             )
            )
            scaleDet = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
             override fun onScale(d: ScaleGestureDetector): Boolean {
              userZoom = (userZoom * d.scaleFactor).coerceIn(0.4f, 5f)
              vv.scaleX = userZoom
              vv.scaleY = userZoom
              showHud((Math.round(userZoom * 100)).toString() + "%")
              return true
             }
            })
            scaleDet.isQuickScaleEnabled = false
            root.setOnTouchListener { v, e -> onGesture(e, v.width, v.height) }

            overlay = FrameLayout(this)
            root.addView(
             overlay,
             FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.MATCH_PARENT,
              FrameLayout.LayoutParams.MATCH_PARENT
             )
            )

            // ---- top bar ----
            val top = LinearLayout(this)
            top.orientation = LinearLayout.HORIZONTAL
            top.gravity = Gravity.CENTER_VERTICAL
            top.setPadding(dp(BarPrefs.x(this)), dp(BarPrefs.y(this)), dp(BarPrefs.x(this)), dp(28))
            top.background = shade(true)

            // lock icon (top-left): open padlock = off, closed padlock = video locked
            lockBtn = RepeatIconView(this)
            lockBtn.kind = 7
            lockBtn.alpha = 0.6f
            lockBtn.setPadding(barPad(), barPad(), barPad(), barPad())
            lockBtn.setOnClickListener { toggleLock() }
            top.addView(lockBtn, topLp())

            // folder icon (next to the lock): opens the phone-folder browser
            folderBtn = RepeatIconView(this)
            folderBtn.kind = 8
            folderBtn.alpha = 0.6f
            folderBtn.setPadding(barPad(), barPad(), barPad(), barPad())
            folderBtn.setOnClickListener { openFolderBrowser() }
            top.addView(folderBtn, topLp())

            // rotate-screen icon now lives in the bottom bar
            rotBtn = RepeatIconView(this)
            rotBtn.kind = 1
            rotBtn.setOnClickListener {
             requestedOrientation =
              if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE)
               ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
              else
               ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
             showOverlay()
            }
            updateRotIcon()

            repeatBtn = RepeatIconView(this)
            repeatBtn.setPadding(barPad(), barPad(), barPad(), barPad())
            repeatBtn.setOnClickListener { cycleRepeat() }
            updateRepeatIcon()

            resumeBtn = RepeatIconView(this)
            resumeBtn.kind = 6
            resumeBtn.setPadding(barPad(), barPad(), barPad(), barPad())
            resumeBtn.setOnClickListener { toggleResume() }
            updateResumeIcon()

            aspectBtn = RepeatIconView(this)
            aspectBtn.kind = 5
            aspectBtn.setPadding(barPad(), barPad(), barPad(), barPad())
            aspectBtn.setOnClickListener { cycleAspect() }
            applyAspect()

            titleView = TextView(this)
            titleView.text = titles.getOrElse(index) { "" }
            titleView.setTextColor(Color.WHITE)
            titleView.textSize = 14f
            titleView.maxLines = 1
            titleView.ellipsize = TextUtils.TruncateAt.END
            titleView.gravity = Gravity.CENTER
            top.addView(titleView, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            val trash = RepeatIconView(this)
            trash.kind = 2
            trash.alpha = 0.6f
            trash.setPadding(barPad(), barPad(), barPad(), barPad())
            trash.setOnClickListener { confirmDeleteCurrent() }
            trashView = trash
            top.addView(trash, topLp())

            overlay.addView(
             top,
             FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.MATCH_PARENT,
              FrameLayout.LayoutParams.WRAP_CONTENT,
              Gravity.TOP
             )
            )

            // ---- bottom bar ----
            val bottom = LinearLayout(this)
            bottom.orientation = LinearLayout.VERTICAL
            bottom.setPadding(dp(16), dp(28), dp(16), dp(16))
            bottom.background = shade(false)
            bottomBarView = bottom

            val timeRow = LinearLayout(this)
            timeRow.orientation = LinearLayout.HORIZONTAL
            timeRow.gravity = Gravity.CENTER_VERTICAL

            cur = TextView(this)
            cur.text = "0:00"
            cur.setTextColor(Color.WHITE)
            cur.textSize = 12f
            total = TextView(this)
            total.text = "0:00"
            total.setTextColor(Color.WHITE)
            total.textSize = 12f

            seek = SeekBar(this)
            val pbLen = BarPrefs.get(this, BarPrefs.progressSpecs[2])
            val pbThick = BarPrefs.get(this, BarPrefs.progressSpecs[3])
            BarPrefs.styleSeek(this, seek, pbThick)
            seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
             override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
              if (fromUser) cur.text = Ui.dur(p.toLong())
             }

             override fun onStartTrackingTouch(s: SeekBar?) {
              dragging = true
              ui.removeCallbacks(hideRun)
             }

             override fun onStopTrackingTouch(s: SeekBar?) {
              vv.seekTo(s?.progress ?: 0)
              dragging = false
              showOverlay()
             }
            })

            val sideW = (100 - pbLen) / 2f
            val seekH = maxOf(dp(36), dp(pbThick) * 3 + dp(8))
            timeRow.addView(cur)
            timeRow.addView(View(this), LinearLayout.LayoutParams(0, 1, sideW))
            timeRow.addView(seek, LinearLayout.LayoutParams(0, seekH, pbLen.toFloat()))
            timeRow.addView(View(this), LinearLayout.LayoutParams(0, 1, sideW))
            timeRow.addView(total)
            timeRow.translationY = -dp(BarPrefs.get(this, BarPrefs.progressSpecs[0])).toFloat()
            bottom.addView(timeRow)

            val ctl = LinearLayout(this)
            ctl.orientation = LinearLayout.HORIZONTAL
            ctl.gravity = Gravity.CENTER

            prevBtn = iconBtn(R.drawable.ic_prev)
            prevBtn.setOnClickListener {
             goPrev()
            }
            playBtn = RepeatIconView(this)
            playBtn.kind = 3
            playBtn.setPadding(dp(10), dp(10), dp(10), dp(10))
            playBtn.setOnClickListener {
             holdPaused = false
             if (vv.isPlaying) vv.pause() else vv.start()
             setPlayIcon(vv.isPlaying)
             showOverlay()
            }
            nextBtn = iconBtn(R.drawable.ic_next)
            nextBtn.setOnClickListener {
             goNext()
            }

            fun lpOf(size: Int): LinearLayout.LayoutParams {
             val p = LinearLayout.LayoutParams(dp(size), dp(size))
             p.marginStart = dp(6)
             p.marginEnd = dp(6)
             return p
            }
            for (hb in listOf<View>(aspectBtn, prevBtn, playBtn, nextBtn, repeatBtn, resumeBtn, rotBtn)) {
             hb.setOnTouchListener { v, e ->
              if (e.action == MotionEvent.ACTION_DOWN) haptic(v)
              false
             }
            }
            BarPrefs.applyBottom(this, prevBtn, playBtn, nextBtn, aspectBtn, repeatBtn, resumeBtn, rotBtn)
            ctl.addView(resumeBtn)
            ctl.addView(repeatBtn)
            ctl.addView(prevBtn)
            ctl.addView(playBtn)
            ctl.addView(nextBtn)
            ctl.addView(aspectBtn)
            ctl.addView(rotBtn)
            bottom.addView(ctl)

            overlay.addView(
             bottom,
             FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.MATCH_PARENT,
              FrameLayout.LayoutParams.WRAP_CONTENT,
              Gravity.BOTTOM
             )
            )

            // ---- gesture feedback (center) ----
            hud = TextView(this)
            hud.setTextColor(Color.WHITE)
            hud.textSize = 20f
            hud.gravity = Gravity.CENTER
            hud.setPadding(dp(18), dp(10), dp(18), dp(10))
            hud.background = Ui.rect(this, Color.argb(160, 0, 0, 0), 14)
            hud.visibility = View.GONE
            root.addView(
             hud,
             FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.WRAP_CONTENT,
              FrameLayout.LayoutParams.WRAP_CONTENT,
              Gravity.CENTER
             )
            )

            // ---- gesture seek bar (bottom) ----
            gSeek = FrameLayout(this)
            val gpThick = BarPrefs.get(this, BarPrefs.progressSpecs[5])
            val gpRad = maxOf(gpThick / 2, 1)
            gSeek.background = Ui.rect(this, BarPrefs.TRACK_COLOR, gpRad)
            gSeek.visibility = View.GONE
            gSeekFill = View(this)
            gSeekFill.background = Ui.rect(this, BarPrefs.PROG_COLOR, gpRad)
            gSeek.addView(gSeekFill, FrameLayout.LayoutParams(0, FrameLayout.LayoutParams.MATCH_PARENT))
            val gsLp = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, dp(gpThick), Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
            gsLp.setMargins(dp(16), 0, dp(16), dp(BarPrefs.get(this, BarPrefs.progressSpecs[1])))
            root.addView(gSeek, gsLp)

            // ---- gesture volume bar (left or right) ----
