            val close = label("✕", 22f, Ui.TEXT)
            close.setPadding(dp(12), dp(4), dp(12), dp(4))
            close.setOnClickListener { dlg.dismiss() }
            bar.addView(close)
            root.addView(bar)

            val lv = ListView(this)
            lv.divider = null
            lv.dividerHeight = 0
            lv.selector = ColorDrawable(Color.TRANSPARENT)
            lv.cacheColorHint = Color.TRANSPARENT
            lv.setPadding(dp(8), 0, dp(8), dp(8))
            lv.clipToPadding = false

            val addBtn = label("افزودن به فهرست", 16f, Color.WHITE, true)
            addBtn.gravity = Gravity.CENTER

            fun updateBtn() {
             addBtn.text = if (sel.isEmpty()) "افزودن به فهرست" else "افزودن به فهرست (" + fa(sel.size.toString()) + ")"
             addBtn.background = Ui.rect(this, if (sel.isEmpty()) Color.parseColor("#2B3A52") else blue, 24)
            }

            val adapter = object : BaseAdapter() {
             override fun getCount(): Int = entries.size
             override fun getItem(position: Int): Any = entries[position]
             override fun getItemId(position: Int): Long = position.toLong()
             override fun getViewTypeCount(): Int = 2
             override fun getItemViewType(position: Int): Int = if (entries[position].head != null) 0 else 1

             override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
              val e = entries[position]
              if (e.head != null) {
               val t: TextView
               if (convertView is TextView) {
                t = convertView
               } else {
                t = label("", 14f, blue, true)
                t.setPadding(dp(10), dp(16), dp(10), dp(6))
               }
               t.text = "📁  " + e.head
               return t
              }
              val v = e.v!!
              val row: LinearLayout
              val check: TextView
              val thumb: ImageView
              val name: TextView
              val sub: TextView
              if (convertView is LinearLayout) {
               row = convertView
               check = row.getChildAt(0) as TextView
               val tb = row.getChildAt(1) as FrameLayout
               thumb = tb.tag as ImageView
               val col = row.getChildAt(2) as LinearLayout
               name = col.getChildAt(0) as TextView
               sub = col.getChildAt(1) as TextView
              } else {
               row = LinearLayout(this@PlaylistActivity)
               row.orientation = LinearLayout.HORIZONTAL
               row.gravity = Gravity.CENTER_VERTICAL
               row.setPadding(dp(10), dp(6), dp(10), dp(6))
               check = TextView(this@PlaylistActivity)
               check.gravity = Gravity.CENTER
               check.textSize = 14f
               check.setTextColor(Color.WHITE)
               row.addView(check, LinearLayout.LayoutParams(dp(24), dp(24)))
               val tb = thumbBox(76, 46)
               (tb.layoutParams as LinearLayout.LayoutParams).marginStart = dp(12)
               thumb = tb.tag as ImageView
               row.addView(tb)
               val col = LinearLayout(this@PlaylistActivity)
               col.orientation = LinearLayout.VERTICAL
               col.setPaddingRelative(dp(12), 0, dp(4), 0)
               name = label("", 14f, Ui.TEXT, true)
               name.maxLines = 2
               name.ellipsize = TextUtils.TruncateAt.END
               sub = label("", 11f, Ui.MUTED)
               col.addView(name)
               col.addView(sub)
               row.addView(col, LinearLayout.LayoutParams(0, WC, 1f))
              }
              val key = v.uri.toString()
              val already = have.contains(key)
              val on = sel.contains(key) || already
              check.text = if (on) "✓" else ""
              check.background = Ui.rect(this@PlaylistActivity, if (on) blue else Color.TRANSPARENT, 5, if (on) blue else Color.parseColor("#3A4A60"), 2)
              name.text = v.title
              sub.text = if (already) "در این فهرست هست" else if (v.dur > 0L) Ui.dur(v.dur) else ""
              row.alpha = if (already) 0.45f else 1f
              bindThumb(thumb, key)
              return row
             }
            }
            lv.adapter = adapter
            lv.setOnItemClickListener { _, _, p, _ ->
             val e = entries[p]
             if (e.head != null) {
              val g = e.group!!
              var allOn = true
              for (v in g) {
               val k = v.uri.toString()
               if (!have.contains(k) && !sel.contains(k)) allOn = false
              }
              for (v in g) {
               val k = v.uri.toString()
               if (!have.contains(k)) {
                if (allOn) sel.remove(k) else sel.add(k)
               }
              }
             } else {
              val k = e.v!!.uri.toString()
              if (!have.contains(k)) {
               if (sel.contains(k)) sel.remove(k) else sel.add(k)
              }
             }
             adapter.notifyDataSetChanged()
             updateBtn()
            }
            root.addView(lv, LinearLayout.LayoutParams(MP, 0, 1f))

            addBtn.setOnClickListener {
             if (sel.isEmpty()) {
              Toast.makeText(this, "ویدئویی انتخاب نشده", Toast.LENGTH_SHORT).show()
             } else {
              for (k in sel) {
               val v = byUri[k]
               if (v != null) pl.items.add(Item(k, v.title, v.dur))
              }
              save()
              dlg.dismiss()
              refresh()
             }
            }
            val abp = LinearLayout.LayoutParams(MP, dp(50))
            abp.setMargins(dp(16), dp(6), dp(16), dp(16))
            root.addView(addBtn, abp)
            updateBtn()

            dlg.setContentView(root)
            val w = dlg.window
            if (w != null) {
             w.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
             try {
              w.statusBarColor = Ui.BG_TOP
              w.navigationBarColor = Ui.BG_BOTTOM
             } catch (e: Throwable) {
             }
            }
            dlg.show()
           }
          }
