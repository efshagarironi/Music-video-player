           private fun lastSeg(d: String): String = if (d.isEmpty()) "نامشخص" else d.substringAfterLast('/')

           // ------------------------------------------------------------------ lifecycle
           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
