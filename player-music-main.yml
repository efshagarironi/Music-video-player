            rotate.translationX = d(g(24)).toFloat(); rotate.translationY = d(g(25)).toFloat()
            repeat.layoutParams = lpOf(14, g(17))
            resume.layoutParams = lpOf(19, g(22))
            val sv = d(g(19)) / 5
            resume.setPadding(sv, sv, sv, sv)
            resume.translationX = d(g(20)).toFloat(); resume.translationY = d(g(21)).toFloat()
            val av = d(g(11)) / 5
            aspect.setPadding(av, av, av, av)
            val rv = d(g(14)) / 5
            repeat.setPadding(rv, rv, rv, rv)
            aspect.translationX = d(g(12)).toFloat(); aspect.translationY = d(g(13)).toFloat()
            repeat.translationX = d(g(15)).toFloat(); repeat.translationY = d(g(16)).toFloat()
