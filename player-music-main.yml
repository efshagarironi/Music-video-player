          // playlist icon: three lines with a plus (same style / size as the layout icon of the folders page)
          class PlaylistIconView(ctx: Context) : View(ctx) {
           var color = Color.WHITE
            set(v) {
             field = v
             invalidate()
            }
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)

           private val tri = android.graphics.Path()

           init {
            p.style = Paint.Style.STROKE
            p.strokeWidth = 54f
            p.strokeCap = Paint.Cap.ROUND
            p.strokeJoin = Paint.Join.ROUND
            p.pathEffect = android.graphics.CornerPathEffect(60f)
            tri.moveTo(500f, 440f)
            tri.lineTo(500f, 660f)
            tri.lineTo(715f, 550f)
            tri.close()
           }

           override fun onDraw(c: Canvas) {
            val cw = (width - paddingLeft - paddingRight).toFloat()
            val ch = (height - paddingTop - paddingBottom).toFloat()
            val s = minOf(cw, ch) / 800f
            p.color = color
            c.save()
            c.translate(paddingLeft.toFloat(), paddingTop.toFloat())
            c.scale(s, s)
            // same visual size / centre as the layout icon
            c.translate(400f, 400f)
            c.scale(1.06f, 1.06f)
            c.translate(-383f, -430f)
            c.drawLine(100f, 200f, 450f, 200f, p)
            c.drawLine(592f, 200f, 667f, 200f, p)
            c.drawLine(100f, 333f, 175f, 333f, p)
            c.drawLine(317f, 333f, 667f, 333f, p)
            c.drawLine(100f, 466f, 367f, 466f, p)
            c.drawLine(100f, 600f, 367f, 600f, p)
            c.drawPath(tri, p)
            c.restore()
           }
          }

          // Video playlists: create as many lists as you like, fill them with videos, play them in order.
          class PlaylistActivity : Activity() {

           class Item(val uri: String, val title: String, val dur: Long)

           class PL(val id: Long, var name: String, val items: ArrayList<Item>)

           class Vid(val uri: Uri, val title: String, val dur: Long, val dirKey: String, val dirName: String)

           class Entry(val head: String?, val group: List<Vid>?, val v: Vid?)

           private val ui = Handler(Looper.getMainLooper())
           private val pool = Executors.newFixedThreadPool(2)
           private val cache = LruCache<String, Bitmap>(80)
           private val lists = ArrayList<PL>()
           private var cur: PL? = null
           private var alive = true
           private var standalone = false
           private val blue = Color.parseColor("#2F80ED")
           private val MP = ViewGroup.LayoutParams.MATCH_PARENT
           private val WC = ViewGroup.LayoutParams.WRAP_CONTENT
           private val sp by lazy { getSharedPreferences("playlists", MODE_PRIVATE) }

           private lateinit var content: LinearLayout

           private fun dp(x: Int) = Ui.dp(this, x)

           private fun label(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, android.graphics.Typeface.BOLD)
            return t
           }

           private fun fa(s: String): String {
            val sb = StringBuilder()
            for (ch in s) {
             if (ch in '0'..'9') sb.append('\u06F0' + (ch - '0')) else sb.append(ch)
            }
            return sb.toString()
           }

           // ------------------------------------------------------------------ storage
           private fun load() {
            lists.clear()
            try {
             val arr = JSONArray(sp.getString("data", "[]"))
             for (i in 0 until arr.length()) {
              val o = arr.getJSONObject(i)
              val its = ArrayList<Item>()
              val ia = o.getJSONArray("items")
              for (j in 0 until ia.length()) {
               val x = ia.getJSONObject(j)
               its.add(Item(x.getString("u"), x.getString("t"), x.optLong("d", 0L)))
              }
              lists.add(PL(o.getLong("id"), o.getString("name"), its))
             }
            } catch (e: Throwable) {
            }
           }

           private fun save() {
            try {
             val arr = JSONArray()
             for (pl in lists) {
              val o = JSONObject()
              o.put("id", pl.id)
              o.put("name", pl.name)
              val ia = JSONArray()
              for (x in pl.items) {
               val xo = JSONObject()
               xo.put("u", x.uri)
               xo.put("t", x.title)
               xo.put("d", x.dur)
               ia.put(xo)
              }
              o.put("items", ia)
              arr.put(o)
             }
             sp.edit().putString("data", arr.toString()).apply()
            } catch (e: Throwable) {
            }
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            window.statusBarColor = Ui.BG_TOP
            window.navigationBarColor = Ui.BG_BOTTOM
            standalone = intent.getBooleanExtra("standalone", false)
            load()
            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.background = Ui.pageBg()
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL
            content = LinearLayout(this)
            content.orientation = LinearLayout.VERTICAL
            root.addView(content, LinearLayout.LayoutParams(MP, MP))
            setContentView(root)
            showList()
           }

           override fun onDestroy() {
            alive = false
            pool.shutdownNow()
            super.onDestroy()
           }

           override fun onBackPressed() {
            if (cur != null) {
             showList()
            } else {
             super.onBackPressed()
            }
           }

           private fun refresh() {
            val c = cur
            if (c == null) showList() else showDetail(c)
           }

           // ------------------------------------------------------------------ thumbnails
           private fun makeThumb(u: Uri): Bitmap? {
            if (Build.VERSION.SDK_INT >= 29 && u.scheme == "content") {
             try {
              return contentResolver.loadThumbnail(u, Size(320, 240), null)
             } catch (e: Throwable) {
             }
            }
            val r = MediaMetadataRetriever()
            return try {
             r.setDataSource(this, u)
             r.getFrameAtTime(1000000)
            } catch (e: Throwable) {
             null
            } finally {
             try {
              r.release()
             } catch (e: Throwable) {
             }
            }
           }

           private fun bindThumb(iv: ImageView, uri: String) {
            iv.setImageBitmap(null)
            iv.tag = uri
            val b = cache.get(uri)
            if (b != null) {
             iv.setImageBitmap(b)
             return
            }
            if (!alive) return
            try {
             pool.execute {
              val bm = makeThumb(Uri.parse(uri))
              if (bm != null) {
               cache.put(uri, bm)
               ui.post {
                if (iv.tag == uri) iv.setImageBitmap(bm)
               }
              }
             }
            } catch (e: Throwable) {
            }
           }

           private fun thumbBox(w: Int, h: Int): FrameLayout {
            val f = FrameLayout(this)
            f.setBackgroundColor(Color.parseColor("#243044"))
            Ui.roundClip(f, 8)
            val iv = ImageView(this)
            iv.scaleType = ImageView.ScaleType.CENTER_CROP
            f.addView(iv, FrameLayout.LayoutParams(MP, MP))
            f.tag = iv
            f.layoutParams = LinearLayout.LayoutParams(dp(w), dp(h))
            return f
           }

           private fun playGlyph(): TextView {
            val t = label("▶", 18f, Color.parseColor("#4B5B75"))
            t.gravity = Gravity.CENTER
            return t
           }

           private fun summary(pl: PL): String {
            if (pl.items.isEmpty()) return fa("0") + " فیلم"
            var ms = 0L
            for (x in pl.items) ms += x.dur
            var s = fa(pl.items.size.toString()) + " فیلم"
            if (ms > 0L) {
             val mins = ms / 60000L
             val h = mins / 60L
             val m = mins % 60L
             s += " · "
             if (h > 0L) s += fa(h.toString()) + " ساعت "
             s += fa(m.toString()) + " دقیقه"
            }
            return s
           }

