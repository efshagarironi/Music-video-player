            addB.setOnClickListener {
             pendingMove = null
             pendingFrom = null
             askNewFolder()
            }
            bar.addView(addB, LinearLayout.LayoutParams(dp(40), dp(40)))
            val ttl = label("پوشه‌های خصوصی", 19f, Ui.TEXT, true)
            ttl.setPaddingRelative(dp(8), 0, dp(8), 0)
            bar.addView(ttl, LinearLayout.LayoutParams(0, WC, 1f))
            bar.addView(layoutButton(), LinearLayout.LayoutParams(dp(40), dp(40)))
