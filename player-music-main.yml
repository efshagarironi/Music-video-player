           }

           override fun onResume() {
            super.onResume()
            ui.post(tickRun)
            if (pos > 0) vv.seekTo(pos)
            showOverlay()
           }

           override fun onPause() {
            holdPaused = prepared && !vv.isPlaying
            pos = vv.currentPosition
            saveResume()
            vv.pause()
            ui.removeCallbacks(tickRun)
            ui.removeCallbacks(hideRun)
            super.onPause()
           }

           override fun onSaveInstanceState(outState: Bundle) {
            super.onSaveInstanceState(outState)
            outState.putInt("pos", vv.currentPosition)
            outState.putInt("index", index)
            outState.putBoolean("locked", locked)
            outState.putBoolean("held", holdPaused || (prepared && !vv.isPlaying))
           }

           override fun onDestroy() {
            ui.removeCallbacksAndMessages(null)
            vv.stopPlayback()
            super.onDestroy()
           }

           override fun onBackPressed() {
            if (locked) {
             showHud("🔒 برای خروج، اول قفل را باز کن")
             showOverlay()
             return
            }
            if (intent.getBooleanExtra("fromNotif", false)) {
             // Opened from the notification: close the video and the whole app.
             finishAndRemoveTask()
            } else {
             super.onBackPressed()
            }
           }

           override fun onWindowFocusChanged(hasFocus: Boolean) {
            super.onWindowFocusChanged(hasFocus)
            if (hasFocus) applyImmersive()
           }
          }
