           private fun folderRow(name: String): View {
            val fs = VaultStore.videos(this, name)
            var total = 0L
            for (f in fs) total += f.length()
            val row = LinearLayout(this)
            row.orientation = LinearLayout.HORIZONTAL
            row.gravity = Gravity.CENTER_VERTICAL
            row.setPadding(dp(8), dp(10), dp(4), dp(10))
            val fic = VaultFolderIconView(this)
            fic.unlocked = VaultStore.noLock(this, name)
            fic.sel = selMode && sel.contains(name)
            row.addView(fic, LinearLayout.LayoutParams(dp(94), dp(70)))
            val col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            col.setPaddingRelative(dp(14), 0, dp(8), 0)
            val n = label(name, 16f, Ui.TEXT, true)
            n.maxLines = 1
            n.ellipsize = TextUtils.TruncateAt.END
            val s = label(fa(fs.size.toString()) + " فیلم · " + fa(Ui.size(total)), 12f, Ui.MUTED)
            s.setPadding(0, dp(4), 0, 0)
            col.addView(n)
            if (!hideList) col.addView(s)
