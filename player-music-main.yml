             .setTitle("حذف ویدئو؟")
             .setMessage(f.name + "\n\nاین فایل برای همیشه پاک می‌شود.")
             .setPositiveButton("حذف") { _, _ ->
              val ok = try {
               f.delete()
              } catch (e: Throwable) {
               false
              }
              if (!ok) toast("حذف انجام نشد")
              else cur?.let { VaultStore.clearOrigin(this, it, f.name) }
              render()
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           private fun confirmRestore(name: String, files: List<File>) {
            AlertDialog.Builder(this)
             .setTitle("خارج کردن از بخش خصوصی")
             .setMessage(fa(files.size.toString()) + " ویدئو به همان پوشه‌ای که از آن به بخش خصوصی آمده بود برمی‌گردد و دوباره در گالری و همهٔ برنامه‌ها دیده می‌شود.")
             .setPositiveButton("خارج کن") { _, _ -> doRestore(name, files) }
             .setNegativeButton("لغو", null)
             .show()
           }

           private fun uniqueFile(dir: File, name: String): File {
            var f = File(dir, name)
            if (!f.exists()) return f
            val stem = name.substringBeforeLast('.', name)
            val ext = if (name.contains('.')) "." + name.substringAfterLast('.') else ""
            var i = 1
            while (f.exists()) {
             f = File(dir, stem + " (" + i + ")" + ext)
             i++
            }
            return f
           }

           private fun doRestore(name: String, files: List<File>, fixed: File? = null) {
            if (!BackupStore.hasAccess(this)) {
             BackupStore.askAccess(this)
             return
            }
            val fallback = File(Environment.getExternalStorageDirectory(), "Movies/" + name)
            val pd = AlertDialog.Builder(this).setMessage("در حال انتقال…").setCancelable(false).create()
            pd.show()
            Thread {
             var ok = 0
             var fail = 0
             val scanned = ArrayList<String>()
             for (f in files) {
              try {
               var dest = fixed ?: fallback
               val od = if (fixed == null) VaultStore.origin(this, name, f.name) else null
               if (od != null) {
                val d = File(od)
                if (d.isDirectory || d.mkdirs()) dest = d
               }
               if (!dest.isDirectory && !dest.mkdirs()) {
                fail++
                continue
               }
               val t = uniqueFile(dest, f.name)
               f.inputStream().use { ins ->
                java.io.FileOutputStream(t).use { outs -> ins.copyTo(outs, 256 * 1024) }
               }
               if (t.length() == f.length()) {
                f.delete()
                VaultStore.clearOrigin(this, name, f.name)
                scanned.add(t.absolutePath)
                ok++
               } else {
                t.delete()
                fail++
               }
              } catch (e: Throwable) {
               fail++
              }
             }
             ui.post {
              try {
               pd.dismiss()
              } catch (e: Throwable) {
              }
              if (alive) {
               toast("خارج شد: " + fa(ok.toString()) + (if (fail > 0) "  ·  ناموفق: " + fa(fail.toString()) else ""))
               if (scanned.isNotEmpty()) MediaScannerConnection.scanFile(this, scanned.toTypedArray(), null, null)
               render()
              }
             }
            }.start()
           }
          }
