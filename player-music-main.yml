          // private folders icon: solid padlock with a keyhole, same colour / size / centre as the layout icon
          class VaultIconView(ctx: Context) : View(ctx) {
           var color = Color.WHITE
            set(v) {
             field = v
             invalidate()
            }
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)
           private val sh = Paint(Paint.ANTI_ALIAS_FLAG)
           private val body = Path()

           init {
            p.style = Paint.Style.FILL
            sh.style = Paint.Style.STROKE
            sh.strokeWidth = 38f
            sh.strokeCap = Paint.Cap.BUTT
            val b = Path()
            b.addRoundRect(RectF(125f, 222f, 388f, 422f), 40f, 40f, Path.Direction.CW)
            val k = Path()
            k.addCircle(256f, 300f, 19f, Path.Direction.CW)
            val slot = Path()
            slot.addRoundRect(RectF(248f, 305f, 264f, 356f), 8f, 8f, Path.Direction.CW)
            k.op(slot, Path.Op.UNION)
            body.op(b, k, Path.Op.DIFFERENCE)
           }

           override fun onDraw(c: Canvas) {
            val cw = (width - paddingLeft - paddingRight).toFloat()
            val ch = (height - paddingTop - paddingBottom).toFloat()
            val s = minOf(cw, ch) / 800f
            p.color = color
            sh.color = color
            c.save()
            c.translate(paddingLeft.toFloat(), paddingTop.toFloat())
            c.scale(s, s)
            // same visual size / centre as the layout icon
            c.translate(400f, 400f)
            c.scale(1.76f, 1.76f)
            c.translate(-256.5f, -252f)
            val arc = Path()
            arc.moveTo(181f, 232f)
            arc.lineTo(181f, 176f)
            arc.arcTo(RectF(181f, 101f, 331f, 251f), 180f, 180f, false)
            arc.lineTo(331f, 232f)
            c.drawPath(arc, sh)
            c.drawPath(body, p)
            c.restore()
           }
          }

          // add icon: rounded square (squircle) with the plus cut out of it; same white colour, size and shadow as the layout icon
          class VaultAddIconView(ctx: Context) : View(ctx) {
           private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
            color = Color.WHITE
            style = Paint.Style.FILL
            setShadowLayer(5f, 0f, 2f, Color.argb(170, 0, 0, 0))
           }
           // the plus (filled white); the square around it is only an outline (hollow)
           private val shape = Path()
           private val frame = Paint(Paint.ANTI_ALIAS_FLAG).apply {
            color = Color.WHITE
            style = Paint.Style.STROKE
            strokeWidth = 2.2f
            setShadowLayer(5f, 0f, 2f, Color.argb(170, 0, 0, 0))
           }

           init {
            setLayerType(LAYER_TYPE_SOFTWARE, null)
            shape.addRoundRect(RectF(7.4f, 11.0f, 16.6f, 13.0f), 0.9f, 0.9f, Path.Direction.CW)
            shape.addRoundRect(RectF(11.0f, 7.4f, 13.0f, 16.6f), 0.9f, 0.9f, Path.Direction.CW)
           }

           override fun onDraw(c: Canvas) {
            val aw = width - paddingLeft - paddingRight
            val ah = height - paddingTop - paddingBottom
            val s = minOf(aw, ah) / 24f
            if (s <= 0f) return
            c.save()
            c.translate(paddingLeft + (aw - 24f * s) / 2f, paddingTop + (ah - 24f * s) / 2f)
            c.scale(s, s)
            c.drawRoundRect(RectF(4.1f, 4.1f, 19.9f, 19.9f), 5.2f, 5.2f, frame)
            c.drawPath(shape, p)
            c.restore()
           }
          }

          // folder icon of the private folders: the same folder as the folders page, with a keyhole in the middle
          class VaultFolderIconView(ctx: Context) : View(ctx) {
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)
           private val k = Paint(Paint.ANTI_ALIAS_FLAG)

           // grid tiles: the folder fills its whole frame
           var full = false
            set(v) {
             if (field != v) {
              field = v
              invalidate()
             }
            }

           // selected: the folder turns blue (same look as the folders page)
           var sel = false
            set(v) {
             if (field != v) {
              field = v
              invalidate()
             }
            }

           // lock removed: the keyhole is not drawn
           var unlocked = false

           init {
            p.color = Color.parseColor("#3E4553")
            k.color = Color.parseColor("#DDE3EE")
            // the keyhole is punched out of the folder (transparent), not painted white
            setLayerType(LAYER_TYPE_HARDWARE, null)
            k.xfermode = android.graphics.PorterDuffXfermode(android.graphics.PorterDuff.Mode.CLEAR)
           }

           override fun onDraw(c: Canvas) {
            p.color = if (sel) Color.parseColor("#3B5B91") else Color.parseColor("#3E4553")
            val w = width.toFloat()
            val h = height.toFloat()
            val l = if (full) 0f else w * 0.08f
            val r = if (full) w else w * 0.92f
            val t = if (full) 0f else h * 0.10f
            val b = if (full) h else h * 0.90f
            val th = (b - t) * 0.16f
            val rad = w * 0.07f
            c.drawRoundRect(RectF(l, t, l + (r - l) * 0.42f, t + th * 3f), rad, rad, p)
            c.drawRoundRect(RectF(l, t + th, r, b), rad, rad, p)
            if (unlocked) return
            // keyhole in the middle of the folder body
            val cx = (l + r) / 2f
            val cy = (t + th + b) / 2f
            val rr = Math.min(r - l, b - t - th) * 0.085f
            c.drawCircle(cx, cy - rr * 0.5f, rr, k)
            c.drawRoundRect(RectF(cx - rr * 0.38f, cy - rr * 0.3f, cx + rr * 0.38f, cy + rr * 2.0f), rr * 0.3f, rr * 0.3f, k)
           }
          }

          // ---------------------------------------------------------------------------
          // Private folders: stored in the app's own storage (invisible to the gallery and other apps).
          // Every folder has its own PIN / pattern (hashed with a random salt, never stored in clear).
          // ---------------------------------------------------------------------------
          object VaultStore {
           private fun sp(c: Context) = c.getSharedPreferences("vault", Context.MODE_PRIVATE)

           fun root(c: Context): File {
            val d = File(c.filesDir, "vault")
            if (!d.isDirectory) d.mkdirs()
            return d
           }

           fun dir(c: Context, name: String): File = File(root(c), name)

           fun exists(c: Context, name: String): Boolean = dir(c, name).isDirectory

           fun list(c: Context): List<String> {
            val fs = root(c).listFiles() ?: return emptyList()
            return fs.filter { it.isDirectory }.map { it.name }.sortedBy { it.lowercase() }
           }

           fun safeName(s: String): String {
            var t = s
            for (ch in charArrayOf('/', '\\', ':', '*', '?', '"', '<', '>', '|')) t = t.replace(ch, '_')
            t = t.trim()
            if (t == "." || t == "..") return ""
            return t
           }

           fun isVideoName(n: String): Boolean {
            val e = n.substringAfterLast('.', "").lowercase()
            return e == "mp4" || e == "mkv" || e == "avi" || e == "mov" || e == "webm" || e == "3gp" ||
             e == "flv" || e == "wmv" || e == "m4v" || e == "ts" || e == "mpg" || e == "mpeg" || e == "mts" || e == "m2ts" ||
             e == "mp3" || e == "m4a" || e == "aac" || e == "ogg" || e == "opus" || e == "wav" || e == "flac" || e == "wma" || e == "amr" || e == "mka"
           }

           fun videos(c: Context, name: String): List<File> {
            val fs = dir(c, name).listFiles() ?: return emptyList()
            return fs.filter { it.isFile && isVideoName(it.name) }.sortedBy { it.name.lowercase() }
           }

           fun type(c: Context, name: String): String = sp(c).getString("t:" + name, "") ?: ""

           // fingerprint as an extra way to open a folder (switched on per folder)
           fun fp(c: Context, name: String): Boolean = sp(c).getBoolean("f:" + name, false)

           fun setFp(c: Context, name: String, v: Boolean) {
            sp(c).edit().putBoolean("f:" + name, v).apply()
           }

           // folder whose lock was removed: opens without any PIN / pattern / fingerprint
           fun noLock(c: Context, name: String): Boolean = sp(c).getBoolean("n:" + name, false)

           fun removeLock(c: Context, name: String) {
            sp(c).edit().remove("t:" + name).remove("s:" + name).remove("h:" + name).remove("f:" + name).putBoolean("n:" + name, true).apply()
           }

           private fun hash(secret: String, salt: ByteArray): String {
            val f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1")
            val k = f.generateSecret(PBEKeySpec(secret.toCharArray(), salt, 8000, 160))
            return Base64.encodeToString(k.encoded, Base64.NO_WRAP)
           }

           fun save(c: Context, name: String, type: String, secret: String) {
            dir(c, name).mkdirs()
            val salt = ByteArray(16)
            SecureRandom().nextBytes(salt)
            sp(c).edit()
             .putString("t:" + name, type)
             .putString("s:" + name, Base64.encodeToString(salt, Base64.NO_WRAP))
             .putString("h:" + name, hash(secret, salt))
             .putBoolean("n:" + name, false)
             .apply()
           }

           fun check(c: Context, name: String, secret: String): Boolean {
            val s = sp(c).getString("s:" + name, null) ?: return false
            val h = sp(c).getString("h:" + name, null) ?: return false
            return try {
             hash(secret, Base64.decode(s, Base64.NO_WRAP)) == h
            } catch (e: Throwable) {
             false
            }
           }

           // original folder of every moved video, so "restore" puts it back where it came from
           private fun op(c: Context) = c.getSharedPreferences("vault_origin", Context.MODE_PRIVATE)

           fun setOrigin(c: Context, name: String, file: String, dir: String) {
            op(c).edit().putString(name + "/" + file, dir).apply()
           }

           fun origin(c: Context, name: String, file: String): String? = op(c).getString(name + "/" + file, null)

           fun clearOrigin(c: Context, name: String, file: String) {
            op(c).edit().remove(name + "/" + file).apply()
           }

           fun forget(c: Context, name: String) {
            sp(c).edit().remove("t:" + name).remove("s:" + name).remove("h:" + name).remove("f:" + name).remove("n:" + name).apply()
            val o = op(c)
            val e = o.edit()
            for (k in o.all.keys) if (k.startsWith(name + "/")) e.remove(k)
            e.apply()
           }

           fun rename(c: Context, old: String, new: String): Boolean {
            val src = dir(c, old)
            val dst = dir(c, new)
            if (dst.exists()) return false
            if (!src.renameTo(dst)) return false
            val p = sp(c)
            p.edit()
             .putString("t:" + new, p.getString("t:" + old, ""))
             .putString("s:" + new, p.getString("s:" + old, ""))
             .putString("h:" + new, p.getString("h:" + old, ""))
             .putBoolean("f:" + new, p.getBoolean("f:" + old, false))
             .putBoolean("n:" + new, p.getBoolean("n:" + old, false))
             .remove("t:" + old).remove("s:" + old).remove("h:" + old).remove("f:" + old).remove("n:" + old)
             .apply()
            val o = op(c)
            val oe = o.edit()
            for ((k, v) in o.all) {
             if (k.startsWith(old + "/")) {
              oe.remove(k)
              oe.putString(new + "/" + k.substring(old.length + 1), v as? String)
             }
            }
            oe.apply()
            return true
           }
          }

