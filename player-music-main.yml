             resetInput(true)
             return
            }
            val f = first
            if (f == null) {
             first = secret
             showPrompt()
             resetInput(false)
            } else if (f == secret) {
             val vn1 = vname
             val sl = slot
             if (vn1 != null) VaultStore.save(this, vn1, type, secret) else if (sl != null) AppLock.saveSlot(this, sl, type, secret) else AppLock.save(this, type, secret)
