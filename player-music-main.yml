           // move into another (or a brand new) locked folder
           private fun moveVaultDialog(from: String, files: List<File>) {
            if (files.isEmpty()) return
            val others = VaultStore.list(this).filter { it != from }
            val items = ArrayList<String>()
            items.add("➕  پوشهٔ قفل جدید")
            for (o in others) items.add("🔒  " + o)
            AlertDialog.Builder(this)
             .setTitle("انتقال به پوشهٔ قفل")
             .setItems(items.toTypedArray()) { _, w ->
              if (w == 0) {
               pendingMove = files
               pendingFrom = from
               askNewFolder()
              } else {
               moveToVault(from, others[w - 1], files)
              }
             }
             .show()
           }

           private fun moveToVault(from: String, to: String, files: List<File>) {
            val dst = VaultStore.dir(this, to)
            dst.mkdirs()
            val pd = AlertDialog.Builder(this).setMessage("در حال انتقال…").setCancelable(false).create()
            pd.show()
            Thread {
             var ok = 0
             var fail = 0
             for (f in files) {
              try {
               val t = uniqueFile(dst, f.name)
               var done = f.renameTo(t)
               if (!done) {
                f.inputStream().use { ins ->
                 java.io.FileOutputStream(t).use { outs -> ins.copyTo(outs, 256 * 1024) }
                }
                if (t.length() == f.length()) {
                 f.delete()
                 done = true
                } else {
                 t.delete()
                }
               }
               if (done) {
                val od = VaultStore.origin(this, from, f.name)
                VaultStore.clearOrigin(this, from, f.name)
                if (od != null) VaultStore.setOrigin(this, to, t.name, od)
                ok++
               } else {
                fail++
               }
              } catch (e: Throwable) {
               fail++
              }
             }
             ui.post {
              try {
               pd.dismiss()
              } catch (e: Throwable) {
              }
              if (alive) {
               toast("منتقل شد: " + fa(ok.toString()) + (if (fail > 0) "  ·  ناموفق: " + fa(fail.toString()) else ""))
               render()
              }
             }
            }.start()
           }

           private fun confirmDeleteVideo(f: File) {
