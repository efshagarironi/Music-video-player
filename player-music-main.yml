           private var pName: String? = null
           private var pAction = 0
           private lateinit var content: LinearLayout

           // layout settings (look / position / size of the folders and videos), kept for this page only
           private val lay by lazy { getSharedPreferences("vault_layout", MODE_PRIVATE) }
           private var vView = 0 // 0 = grid, 1 = list
           private var vColsF = 4
           private var vColsV = 3
           private val vSz = intArrayOf(110, 110, 20, 0, 110, 110, 20, 0)

           // top bar placement, one set per page: [0] = private folders page, [1] = locked folder (videos) page
           // tbY: 100 = icons where they were, 0 = right under the selfie camera; tbG: gap (dp) between the icons and the shaded edge
           private val tbY = intArrayOf(100, 100)
           private val tbG = intArrayOf(10, 10)
           private var curBar: LinearLayout? = null
           private var curSelBar: LinearLayout? = null
           private var bottomBar: LinearLayout? = null
           private var selCount: TextView? = null
           private var curAdapter: BaseAdapter? = null
           private var curKeys: List<String> = emptyList()
           private var curFiles: List<File> = emptyList()

           // selection mode (long press): folder names on the folders page, file names inside a folder
           private var selMode = false
           private val sel = LinkedHashSet<String>()
           private var pendingMove: List<File>? = null
           private var pendingFrom: String? = null
           private val pQueue = ArrayList<String>()
           private var gHsp = 0
           private var gGapV = 0
           private var gEdge = 0
           private var gIconH = 0
           private var gThumbH = 0

           private fun szMin(i: Int): Int = if (i % 4 == 0) 50 else if (i % 4 == 1) 50 else 0
           private fun szMax(i: Int): Int = if (i % 4 == 0) 130 else if (i % 4 == 1) 150 else 48

           private fun loadLayout() {
            vView = lay.getInt("view", 0).coerceIn(0, 1)
            hideDetail = lay.getBoolean("hideDetail", false)
            hideList = lay.getBoolean("hideList", false)
            vColsF = lay.getInt("colsF", 4).coerceIn(2, 10)
            vColsV = lay.getInt("colsV", 3).coerceIn(2, 10)
            val def = intArrayOf(110, 110, 20, 0, 110, 110, 20, 0)
            for (i in vSz.indices) vSz[i] = lay.getInt("sz" + i, def[i]).coerceIn(szMin(i), szMax(i))
            for (i in 0..1) {
             tbY[i] = lay.getInt("tbY" + i, 100).coerceIn(0, 100)
             tbG[i] = lay.getInt("tbG" + i, 10).coerceIn(0, 40)
            }
           }

           private fun saveLayout() {
            val e = lay.edit()
            e.putInt("view", vView)
            e.putBoolean("hideDetail", hideDetail)
            e.putBoolean("hideList", hideList)
            e.putInt("colsF", vColsF)
            e.putInt("colsV", vColsV)
            for (i in vSz.indices) e.putInt("sz" + i, vSz[i])
            for (i in 0..1) {
             e.putInt("tbY" + i, tbY[i])
             e.putInt("tbG" + i, tbG[i])
            }
            e.apply()
           }

           // grid geometry (same formulas as the folders page): k = 0 folders, 4 videos
           private fun calcGrid(k: Int, n: Int) {
            val dens = resources.displayMetrics.density
            val wPx = resources.displayMetrics.widthPixels.toFloat()
            val edge = vSz[k + 2] * dens
            val natW: Float
            val natH: Float
            if (k == 0) {
             val gp0 = (24f * dens - 4f * dens - 0.08f * (wPx / n - 8f * dens)) / (1f - 0.16f / n)
             val c0 = (wPx - 2f * gp0) / n
             natW = 0.84f * (c0 - 8f * dens)
             natH = 0.576f * (c0 - 8f * dens)
            } else {
             natW = (wPx - 48f * dens - 24f * dens * (n - 1)) / n
             natH = natW * 0.62f
            }
            val slot = (wPx - 2f * edge) / n
            var tw = natW * vSz[k] / 100f
            if (tw > slot) tw = slot
            if (tw < 8f * dens) tw = 8f * dens
            gHsp = if (n > 1) Math.max(((wPx - 2f * edge - n * tw) / (n - 1)).toInt(), 0) else 0
            gGapV = (vSz[k + 3] * dens).toInt()
            gEdge = edge.toInt()
            gIconH = Math.max((natH * vSz[k + 1] / 100f).toInt(), dp(8))
            gThumbH = gIconH
           }

           // list (view 1) or grid (view 0) of folders (k = 0) or videos (k = 4)
           private fun makeList(k: Int, count: Int, item: (Int) -> View): AbsListView {
            val lv: AbsListView
            if (vView == 1) {
             val l = ListView(this)
             l.divider = null
             l.dividerHeight = 0
             l.setPadding(dp(8), dp(4), dp(8), dp(24))
             lv = l
            } else {
             val n = if (k == 0) vColsF else vColsV
             calcGrid(k, n)
             val g = GridView(this)
             g.numColumns = n
             g.horizontalSpacing = gHsp
             g.verticalSpacing = gGapV
             g.setPadding(gEdge, dp(10), gEdge, dp(24))
             lv = g
            }
            lv.clipToPadding = false
            lv.selector = ColorDrawable(Color.TRANSPARENT)
            lv.cacheColorHint = Color.TRANSPARENT
            val ad = object : BaseAdapter() {
             override fun getCount(): Int = count
             override fun getItem(position: Int): Any = position
             override fun getItemId(position: Int): Long = position.toLong()
             override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View = item(position)
            }
            curAdapter = ad
            lv.setAdapter(ad)
            return lv
           }

           private fun layoutButton(): View {
            val b = RepeatIconView(this)
            b.kind = 9
            b.setPadding(dp(8), dp(8), dp(8), dp(8))
            b.setOnClickListener { showLayoutSheet() }
            return b
           }

           private fun folderTile(name: String): View {
            val fs = VaultStore.videos(this, name)
            val t = LinearLayout(this)
            t.orientation = LinearLayout.VERTICAL
            t.gravity = Gravity.CENTER_HORIZONTAL
            val on = selMode && sel.contains(name)
            val fi = VaultFolderIconView(this)
            fi.full = true
            fi.unlocked = VaultStore.noLock(this, name)
            fi.sel = on
            t.addView(withBadge(fi, on), LinearLayout.LayoutParams(MP, gIconH))
            val n = label(name, 13f, Ui.TEXT, true)
            n.maxLines = 1
            n.ellipsize = TextUtils.TruncateAt.END
            n.gravity = Gravity.CENTER
            n.setPadding(dp(2), dp(4), dp(2), 0)
            t.addView(n, LinearLayout.LayoutParams(MP, WC))
            val s = label(fa(fs.size.toString()) + " فیلم", 11f, Ui.MUTED)
            s.gravity = Gravity.CENTER
            if (!hideList) t.addView(s, LinearLayout.LayoutParams(MP, WC))
            return t
           }

           private fun videoTile(files: List<File>, i: Int): View {
            val f = files[i]
            val t = LinearLayout(this)
            t.orientation = LinearLayout.VERTICAL
            val on = selMode && sel.contains(f.name)
            val box = thumbBox(1, 1)
            bindThumb(box.tag as ImageView, f.absolutePath)
            box.foreground = if (on) ColorDrawable(Color.argb(90, 47, 128, 237)) else null
            t.addView(withBadge(box, on), LinearLayout.LayoutParams(MP, gThumbH))
            val n = label(f.name.substringBeforeLast('.'), 12f, Ui.TEXT, true)
            n.maxLines = 2
            n.ellipsize = TextUtils.TruncateAt.END
            n.setPadding(dp(2), dp(4), dp(2), 0)
            t.addView(n, LinearLayout.LayoutParams(MP, WC))
            val s = label(fa(Ui.size(f.length())), 11f, Ui.MUTED)
            s.setPadding(dp(2), 0, dp(2), 0)
            t.addView(s, LinearLayout.LayoutParams(MP, WC))
            return t
           }

