           private fun videoRow(name: String, files: List<File>, i: Int): View {
            val f = files[i]
            val row = LinearLayout(this)
            row.orientation = LinearLayout.HORIZONTAL
            row.gravity = Gravity.CENTER_VERTICAL
            row.setPadding(dp(8), dp(8), dp(4), dp(8))
            val box = thumbBox(106, 60)
            bindThumb(box.tag as ImageView, f.absolutePath)
            box.foreground = if (selMode && sel.contains(f.name)) ColorDrawable(Color.argb(90, 47, 128, 237)) else null
            row.addView(box)
            val col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            col.setPaddingRelative(dp(14), 0, dp(8), 0)
            val n = label(f.name.substringBeforeLast('.'), 15f, Ui.TEXT, true)
            n.maxLines = 2
            n.ellipsize = TextUtils.TruncateAt.END
            val s = label(fa(Ui.size(f.length())), 12f, Ui.MUTED)
            s.setPadding(0, dp(4), 0, 0)
            col.addView(n)
            col.addView(s)
            row.addView(col, LinearLayout.LayoutParams(0, WC, 1f))
            row.addView(menuMark(f.name) { videoMenu(name, f) })
            markSel(row, selMode && sel.contains(f.name))
            return row
           }

           private fun play(files: List<File>, idx: Int) {
            external = true
            val i = Intent(this, PlayerActivity::class.java)
            i.putExtra("uris", files.map { Uri.fromFile(it).toString() }.toTypedArray())
            i.putExtra("titles", files.map { it.name.substringBeforeLast('.') }.toTypedArray())
            i.putExtra("index", idx)
            i.putExtra("startPos", 0)
            i.putExtra("autoNext", true)
            i.putExtra("private", true)
            startActivity(i)
           }

           // opens the phone's folders page in "pick" mode: select videos and tap the lock icon
           private fun addVideos(name: String) {
            external = true
            val i = Intent(this, FolderBrowserActivity::class.java)
            i.putExtra("vaultTarget", name)
            startActivityForResult(i, 84)
           }

           // ------------------------------------------------------------------ group actions
           private fun confirmDeleteFolders(names: List<String>) {
            if (names.isEmpty()) return
            AlertDialog.Builder(this)
             .setTitle("حذف " + fa(names.size.toString()) + " پوشهٔ خصوصی؟")
             .setMessage("پوشه‌ها و همهٔ ویدئوهای داخل آن‌ها برای همیشه پاک می‌شوند. برای هر پوشه، رمز یا الگوی خودش (یا اثر انگشتش) پرسیده می‌شود.")
             .setPositiveButton("حذف") { _, _ ->
              pQueue.clear()
              pQueue.addAll(names)
              nextDelete()
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           private fun nextDelete() {
            if (pQueue.isEmpty()) {
             showList()
             return
            }
            startUnlock(pQueue[0], 5)
           }

           private fun toggleFp(n: String) {
            if (VaultStore.fp(this, n)) {
             VaultStore.setFp(this, n, false)
             toast("اثر انگشت برای این پوشه خاموش شد")
            } else if (!packageManager.hasSystemFeature(PackageManager.FEATURE_FINGERPRINT)) {
             toast("این گوشی حسگر اثر انگشت ندارد")
            } else {
             VaultStore.setFp(this, n, true)
             toast("اثر انگشت برای این پوشه روشن شد")
            }
            showList()
           }

           // after a folder lock is saved: offer the fingerprint as a second way in
           private fun offerFp(n: String) {
            if (VaultStore.fp(this, n)) return
