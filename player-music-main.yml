           // ---------------- biometrics ----------------
           // app lock / security page: fingerprint and face as chosen in the security page;
           // private folder: fingerprint only, when it is switched on for that folder
           private fun fpOn(): Boolean {
            val vn = vname
            val sl = slot
            return if (vn != null) VaultStore.fp(this, vn) else if (sl != null) AppLock.slotFp(this, sl) else AppLock.fp(this)
           }

           private fun faceOn(): Boolean = if (vname != null || slot != null) false else AppLock.face(this)

           private fun bioAllowed(): Boolean = mode == "unlock" && (fpOn() || faceOn())

           private fun startBio() {
            if (!bioAllowed() || bioActive) return
            val fp = fpOn()
            val face = faceOn()
            if (!fp && !face) return
            try {
             if (Build.VERSION.SDK_INT >= 28 && face) {
              promptSystem()
             } else if (fp) {
              try {
               promptFingerprint()
              } catch (t: Throwable) {
               bioActive = false
               if (Build.VERSION.SDK_INT >= 28) promptSystem()
              }
             }
            } catch (t: Throwable) {
             bioActive = false
            }
           }

           @android.annotation.TargetApi(28)
           private fun promptSystem() {
            val cs = CancellationSignal()
            cancel = cs
            bioActive = true
            val b = android.hardware.biometrics.BiometricPrompt.Builder(this)
             .setTitle(if (vname != null) "باز کردن پوشهٔ خصوصی" else if (slot == "vault") "ورود به پوشه‌های خصوصی" else if (slot == "uni" || slot == "ugd") "تأیید قفل حذف نصب" else if (sec) "ورود به بخش امنیت" else "باز کردن قفل برنامه")
             .setNegativeButton("استفاده از رمز یا الگو", mainExecutor, DialogInterface.OnClickListener { _, _ -> bioActive = false })
            if (Build.VERSION.SDK_INT >= 29) {
             b.setConfirmationRequired(false)
            }
            if (Build.VERSION.SDK_INT >= 30) {
             b.setAllowedAuthenticators(android.hardware.biometrics.BiometricManager.Authenticators.BIOMETRIC_WEAK)
            }
            b.build().authenticate(cs, mainExecutor, object : android.hardware.biometrics.BiometricPrompt.AuthenticationCallback() {
             override fun onAuthenticationSucceeded(result: android.hardware.biometrics.BiometricPrompt.AuthenticationResult?) {
              bioActive = false
              unlockOk()
             }

             override fun onAuthenticationError(errorCode: Int, errString: CharSequence?) {
              bioActive = false
             }

             override fun onAuthenticationFailed() {}
            })
           }

           @Suppress("DEPRECATION")
           private fun promptFingerprint() {
            val fm = getSystemService(Context.FINGERPRINT_SERVICE) as? android.hardware.fingerprint.FingerprintManager
             ?: throw IllegalStateException("no fingerprint")
            if (!fm.isHardwareDetected || !fm.hasEnrolledFingerprints()) {
             warn("هیچ اثر انگشتی در گوشی ثبت نشده؛ با رمز یا الگو وارد شو")
             return
            }
            val cs = CancellationSignal()
            cancel = cs
            bioActive = true
            msg.setTextColor(Ui.GREEN)
            msg.text = "🔐 اثر انگشتت را روی حسگر بگذار\nیا " + (if (type == "pin") "رمز" else "الگو") + " را وارد کن"
            fm.authenticate(null, cs, 0, object : android.hardware.fingerprint.FingerprintManager.AuthenticationCallback() {
             override fun onAuthenticationSucceeded(result: android.hardware.fingerprint.FingerprintManager.AuthenticationResult?) {
              bioActive = false
              unlockOk()
             }

             override fun onAuthenticationError(errMsgId: Int, errString: CharSequence?) {
              bioActive = false
             }

             override fun onAuthenticationFailed() {
              msg.setTextColor(Ui.DANGER)
              msg.text = "اثر انگشت شناخته نشد؛ دوباره امتحان کن"
             }
            }, null)
           }

           override fun onResume() {
            super.onResume()
            if (bioAllowed()) startBio()
           }

           override fun onStop() {
            try {
             cancel?.cancel()
            } catch (t: Throwable) {
            }
            cancel = null
            bioActive = false
            super.onStop()
            // removal guard: leaving this screen without the right answer counts as "no"
            if (guard && !guardDone && !isFinishing) finish()
            }

            private fun goHome() {
             try {
              val h = Intent(Intent.ACTION_MAIN)
              h.addCategory(Intent.CATEGORY_HOME)
              h.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              startActivity(h)
             } catch (t: Throwable) {
             }
            }

           override fun onDestroy() {
            ui.removeCallbacksAndMessages(null)
            if (mode == "unlock" && vname == null && !sec) AppLock.showing = false
            if (guard) AppLock.guardShowing = false
            super.onDestroy()
           }

           override fun onBackPressed() {
            if (guard) {
             goHome()
             finish()
             return
            }
            if (mode == "set" || vname != null || sec) {
             setResult(RESULT_CANCELED)
             finish()
            } else {
             moveTaskToBack(true)
            }
           }
          }
